name: Refresh network tiles

# Bakes the Swedish runnable-path network (Geofabrik extract, ODbL) into
# fixed-grid JSON tiles on the orphan `network-tiles` branch, which
# raw.githubusercontent.com serves with CORS * and transparent gzip — the
# apps' area downloads become CDN fetches inside Sweden, with Overpass as
# the fallback everywhere else. Monthly: paths change slowly, and the tiles
# carry their generated date.

on:
  schedule:
    - cron: '30 3 2 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: network-tiles
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install osmium
        run: sudo apt-get update && sudo apt-get install -y osmium-tool
      - name: Download and filter the Sweden extract
        run: |
          curl -fsSL -o sweden.osm.pbf https://download.geofabrik.de/europe/sweden-latest.osm.pbf
          ls -l sweden.osm.pbf
          # Value-exact filter (a broad w/highway pulled >16.7M nodes, past a
          # JS Map's limit); keepWay in the tiler still applies buildQuery's
          # precise clause logic (the access/foot negations osmium cannot
          # express).
          osmium tags-filter sweden.osm.pbf \
            w/highway=footway,path,track,cycleway,residential,living_street,unclassified,tertiary,service,pedestrian,steps,bridleway \
            w/barrier \
            w/railway=rail,tram,light_rail \
            w/waterway=river,stream,canal,ditch \
            -o filtered.pbf
          osmium cat --object-type n -f opl filtered.pbf -o nodes.opl
          osmium cat --object-type w -f opl filtered.pbf -o ways.opl
          ls -l filtered.pbf nodes.opl ways.opl
      - name: Build tiles
        env:
          NODE_OPTIONS: --max-old-space-size=12288
        run: npx tsx scripts/build-network-tiles.ts nodes.opl ways.opl tiles
      - name: Build building tiles
        # Footprints ride beside the network tiles on the same branch:
        # polyline-encoded rings, no tags, no node joining (osmium export
        # assembles the geometry, multipolygons included).
        run: |
          rm -f nodes.opl ways.opl filtered.pbf
          osmium tags-filter sweden.osm.pbf w/building -o buildings.pbf
          osmium export buildings.pbf -f geojsonseq --attributes=type,id \
            --geometry-types=polygon \
            | npx tsx scripts/build-building-tiles.ts tiles
      - name: Publish to the network-tiles branch
        # Same pattern as the Pages workflow's `deployed` branch: a fresh
        # single-commit orphan branch force-pushed, so the branch never grows.
        run: |
          cd tiles
          git init -b network-tiles
          git add -A
          git -c user.name=actions -c user.email=actions@github.com \
            commit -m "network tiles $GITHUB_SHA"
          git push --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" network-tiles
