name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspaces --if-present
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          for dist in apps/*/dist; do
            app=$(basename "$(dirname "$dist")")
            cp -r "$dist" "_site/$app"
          done
          # The bus variant builds from the runtour codebase into dist-bus.
          cp -r apps/runtour/dist-bus _site/bustour
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
