<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#2d7a4f" />
    <title>RunTour</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="map"></div>
    <div id="sheet">
      <div id="sheet-top">
        <div id="sheet-handle" role="button" aria-label="Resize the panel" tabindex="0"></div>
      </div>
      <section id="controls">
        <h1>RunTour</h1>
        <div id="shelf" hidden></div>
        <div class="row" id="gpx-row">
          <label class="control">
            <span>Course GPX</span>
            <input type="file" id="gpx-input" accept=".gpx,application/gpx+xml" />
          </label>
          <label class="control">
            <span>Tour JSON</span>
            <input type="file" id="tour-input" accept=".json,application/json" />
          </label>
        </div>
        <p class="hint" id="course-stats" hidden></p>
        <p class="hint" id="hint">Upload a GPX of the course you plan to run.</p>
        <div class="row" id="places-row" hidden>
          <label class="control lang-control">
            <span>Local Wikipedia</span>
            <input type="text" id="lang-input" value="sv" size="3" maxlength="7" />
          </label>
          <button id="find-places">Find places</button>
        </div>
        <p class="hint" id="status" hidden></p>
        <div id="text-controls" hidden>
          <label class="control">
            <span>Clip length: <output id="target-output">40</output> s</span>
            <input type="range" id="target-seconds" min="20" max="120" step="5" value="40" />
          </label>
          <div class="row">
            <button id="fetch-texts">Fetch texts</button>
            <button id="export-tour">Save tour.json</button>
            <button id="export-gpx">GPX ⤓</button>
            <button id="save-phone" hidden>Save to phone</button>
          </div>
        </div>
        <div id="preview-controls" hidden>
          <div class="row">
            <label class="control pace-control">
              <span>Pace min/km</span>
              <input type="text" id="pace-input" value="5:30" size="5" />
            </label>
            <label class="check"><input type="checkbox" id="preview-fast" /> ×10</label>
            <label class="check"><input type="checkbox" id="preview-gps" /> real GPS</label>
            <button id="preview-btn">Preview run</button>
          </div>
          <p class="hint" id="preview-note" hidden>
            The browser preview needs the screen on; the Android app runs with it off.
          </p>
        </div>
        <label id="toggle-row" hidden><input type="checkbox" id="toggle-markers" checked /> Show place markers</label>
        <div id="search-row" hidden>
          <input type="search" id="name-search" placeholder="Add a place by name…" />
          <button id="search-btn">Search</button>
        </div>
        <ul id="search-results" hidden></ul>
        <ol id="place-list"></ol>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
